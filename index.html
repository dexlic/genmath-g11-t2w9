<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GO APP · General Math 11 · Term 2 Week 9</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#14213d;--mut:#586179;--navy:#14213d;--gold:#c8962b;--goldbg:#f8ecc9;--ok:#2b7a4b;--bad:#b3392f;--line:#e2dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1325;--card:#161f38;--ink:#eef0f6;--mut:#a4aec6;--gold:#e0b04a;--goldbg:#2b2512;--ok:#5cc08a;--bad:#ef7a70;--line:#2a3452}}
:root[data-theme="dark"]{--bg:#0d1325;--card:#161f38;--ink:#eef0f6;--mut:#a4aec6;--gold:#e0b04a;--goldbg:#2b2512;--ok:#5cc08a;--bad:#ef7a70;--line:#2a3452}
*{box-sizing:inherit}html,body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 Calibri,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0;line-height:1.2}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px}
header.top{background:#14213d;color:#fff;padding:14px 16px 18px;border-bottom:4px solid var(--gold)}
.brand{display:flex;gap:12px;align-items:center}.brand b{display:block;font:700 15px/1.25 Cambria,Georgia,serif}.brand span{font-size:12px;opacity:.8}
.subj{margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.subj h1{font-size:24px;color:#fff}.subj small{display:block;color:#e8c777;font-size:13px}
.tools{display:flex;gap:6px;align-items:center}.badge{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 10px;font-size:12px;white-space:nowrap}
.ib{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;min-height:36px;min-width:36px;font:inherit;cursor:pointer}
main{padding:16px}
.anchor{background:var(--goldbg);border-left:5px solid var(--gold);border-radius:6px;padding:12px 14px;margin-bottom:16px}.anchor h3{font-size:15px;margin-bottom:4px}.anchor p{margin:0;font-size:14px}
.meta{font-size:13px;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gold)}
.spine{margin:20px 0 0 14px;padding-left:28px;border-left:3px solid var(--line)}.day{position:relative;margin-bottom:14px}
.node{position:absolute;left:-44px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--gold);display:grid;place-items:center;font-size:12px;font-weight:700}
.locked .node{border-color:var(--line);color:var(--mut)}.fin .node{background:var(--ok);border-color:var(--ok);color:#fff}
.dcard{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;min-height:56px}
.dcard[disabled]{opacity:.55;cursor:not-allowed}.dcard h3{font-size:16px}.dcard p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.steps{display:flex;gap:4px;margin:6px 0 14px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.panel h2{font-size:20px;margin-bottom:8px}.panel p{margin:8px 0}
.chip{display:inline-block;background:var(--goldbg);border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:8px}
.btn{display:block;width:100%;min-height:50px;border-radius:10px;border:0;background:#14213d;color:#fff;font:700 16px inherit;cursor:pointer;margin-top:12px}
.btn.gold{background:var(--gold);color:#14213d}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px}.row .btn{margin-top:12px}
.back{background:none;border:0;color:var(--ink);font:inherit;padding:8px 0;min-height:44px;cursor:pointer}
.eq{display:block;text-align:center;font:700 21px/1.5 Cambria,Georgia,serif;background:var(--bg);border:2px solid var(--gold);border-radius:10px;padding:10px;margin:12px 0}
.ws{border-left:4px solid var(--gold);background:var(--bg);padding:6px 12px;margin:8px 0;border-radius:0 8px 8px 0}.ws b{font-family:Cambria,Georgia,serif}
.err{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));padding:6px 12px;margin:8px 0;border-radius:0 8px 8px 0}
.good{border-left:4px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));padding:6px 12px;margin:8px 0;border-radius:0 8px 8px 0}
.num{width:100%;min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 20px inherit;padding:8px 12px}
.hint{font-size:14px;margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--goldbg)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font:inherit;color:var(--ink);min-height:48px;cursor:pointer}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.pack{font-size:12px;color:var(--mut);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.fig{display:block;width:100%;height:auto;margin:8px 0 0}.fig .s{fill:var(--gold);opacity:.55}.fig .c{fill:none;stroke:var(--ink);stroke-width:1.6}.fig text{fill:var(--mut);font:10px sans-serif;text-anchor:middle}
.cap{font-size:13px;color:var(--mut);text-align:center;margin:0 0 10px!important}
details.zc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}details.zc summary{cursor:pointer;font-weight:700;min-height:32px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

<script>
/* ===== CONTENT: Grade 11 General Mathematics · Term 2 · Week 9 (from the DLL) ===== */
var D=[
{t:"Reading the Z-Table",s:"Areas left, right, and between",o:"I can find P(Z &lt; z), P(Z &gt; z) and P(a &lt; Z &lt; b) using the Z-table, with a shaded sketch.",
c:[["Hook: Bell Curve Folding","Imagine a bell curve cut out of paper. Fold it down the middle. Both sides match! What percent of the whole area is on the right of the fold? <b>50%</b>. Kung patas ang duha ka kilid, pila ka porsiyento ang naa sa tuo?§0,9§Now look at a small tail at the far end. <b>How can we find its area?</b> Today's tool is the Z-table."],
["Why we need it","The whole area under the curve is <b>1</b> (100%). So <b>area = probability</b>. The Z-table gives only one kind of area: the part to the <b>LEFT</b> of z.<div class='eq' style='font-size:18px'>P(Z &gt; z) = 1 − P(Z &lt; z)<br>P(a &lt; Z &lt; b) = P(Z &lt; b) − P(Z &lt; a)</div>Every other region is built from that one left-area number. A single point has no width, so <b>P(Z = z) = 0</b>."],
["How to read the table","Row = ones and tenths. Column = hundredths. Where they meet is the left area.<div class='ws'><b>Lookup 1:</b> z = 1.25 → row 1.2, column .05 → <b>0.8944</b><br><b>Lookup 2:</b> z = 0.60 → row 0.6, column .00 → <b>0.7257</b><br><b>Lookup 3:</b> z = −0.80 → row −0.8, column .00 → <b>0.2119</b></div>Negative z-values are in the table too. Read them directly."],
["Examples 1 and 2","<b>Example 1: right tail.</b> Find P(Z &gt; 1.25).<div class='ws'>Left area = 0.8944<br>Right = 1 − 0.8944 = <b>0.1056</b></div>§1.25,9§<b>Example 2: between.</b> Find P(−1.00 &lt; Z &lt; 1.50).<div class='ws'>P(Z &lt; 1.50) = 0.9332<br>P(Z &lt; −1.00) = 0.1587<br>0.9332 − 0.1587 = <b>0.7745</b></div>§-1,1.5§Big left area minus small left area."],
["Example 3 and common errors","<b>Example 3: left tail.</b> Find P(Z &lt; −0.80). The table gives it directly: <b>0.2119</b>.§-9,-0.8§<div class='err'><b>✗ Error 1:</b> 1 − 0.2119 = 0.7881. That is the area to the RIGHT.</div><div class='err'><b>✗ Error 2:</b> P(Z = 1.25) = 0.8944. A point has zero width, so it is 0.</div><div class='good'><b>✓ Always sketch and shade first</b>, then decide: left, right, or between?</div>"],
["Remember","<b>Left</b> → read the table. <b>Right</b> → 1 − table. <b>Between</b> → big minus small. Next: you try."]],
y:{p:"Find P(−2.00 &lt; Z &lt; 0).",st:[["Step 1. Find P(Z &lt; 0).",0.5,["The curve is symmetric about 0.","Half of the area is on each side.","P(Z &lt; 0) = 0.5000."]],["Step 2. Find P(Z &lt; −2.00).",0.0228,["Use row −2.0, column .00.","Negative z is in the table. Read it directly.","P(Z &lt; −2.00) = 0.0228."]],["Step 3. Subtract: P(Z &lt; 0) − P(Z &lt; −2.00).",0.4772,["Bigger left area minus smaller left area.","0.5000 − 0.0228","= 0.4772."]]],f:"P(−2.00 &lt; Z &lt; 0) = <b>0.4772</b>. About 47.7% of the area lies between z = −2 and the mean.§-2,0§"},
sp:{w:"P(Z &lt; −0.80) = 1 − 0.2119 = 0.7881",o:["He subtracted from 1, which gives the area to the right, not the left.","He read the wrong row in the table.","He should have added 0.5.","Negative z-values are not in the table."],a:0,x:"The table already gives the LEFT area for negative z, so P(Z &lt; −0.80) = 0.2119."},
q:[["P(Z &lt; −0.50)",0.3085,0,"Row −0.5, column .00 → 0.3085."],["P(Z &gt; 0.50)",0.3085,0,"1 − 0.6915 = 0.3085. By symmetry it equals P(Z &lt; −0.50)."],["P(−1.00 &lt; Z &lt; 1.00)",0.6826,0,"0.8413 − 0.1587 = 0.6826."],["P(Z &gt; 1.96)",0.025,0,"1 − 0.9750 = 0.0250."],["P(Z = 0) = ? (a single point has no width)",0,0,"A single point has zero area, so P(Z = 0) = 0. (P(Z &lt; 0) is 0.5.)"]]},
{t:"Percentiles: From Area Back to z",s:"Table and technology",o:"I can find the z-value for a given percentile or area using the table (nearest area) and technology.",
c:[["Hook: Top 10 Ka Porsiyento","Kung ang top 10% sa klase makadawat og scholarship, unsa ka taas ang puntos nga kinahanglan nimo: 85? 90? <b>Write your guess on paper now.</b> At the end of the lesson we compare it with the exact cut-off."],
["Why we need it","A <b>percentile</b> tells how much of the data lies <i>below</i> a point. The 90th percentile has 90% of the area to its left. Honor-roll lines, scholarship cut-offs, and the growth charts at the barangay health center all use percentiles.<br><br>Before, we started with z and found area. Today we run the table <b>backward: start with the area, find z</b>."],
["The rule","<div class='eq' style='font-size:18px'>kth percentile: P(Z &lt; z) = k/100</div><div class='ws'><b>Area above 0.50</b> → z is positive<br><b>Area below 0.50</b> → z is negative<br><b>Table:</b> find the area nearest to the target, then read z from its row and column<br><b>Technology:</b> NORM.S.INV(area) or InvNorm</div>"],
["Examples 1 and 2","<b>Example 1: 90th percentile.</b> Target area 0.9000.<div class='ws'>Table: 0.8997 at z = 1.28 and 0.9015 at z = 1.29<br>0.8997 is nearer → <b>z ≈ 1.28</b><br>Excel =NORM.S.INV(0.90) → 1.2816</div>§-9,1.28§<b>Example 2: 25th percentile.</b> Target area 0.2500.<div class='ws'>Table: 0.2514 at z = −0.67 and 0.2483 at z = −0.68<br>0.2514 is nearer → <b>z ≈ −0.67</b><br>Technology → −0.6745</div>§-9,-0.67§"],
["Example 3 and common error","<b>Example 3: 95th percentile.</b> The table has 0.9495 at 1.64 and 0.9505 at 1.65. Both are equally near 0.9500, so we take the middle: <b>z = 1.645</b> (technology: 1.6449).§-9,1.645§<div class='err'><b>✗ Wrong:</b> “The 90th percentile is z = −1.28.”<br>The area to the left is more than 0.50, so z must be positive.</div><div class='good'><b>✓ Right:</b> z = −1.28 is the <b>10th</b> percentile (area 0.1003).</div>"],
["Remember: percentile cheat sheet","<div class='ws'>5th → −1.645 · 10th → −1.28<br>25th → −0.67 · 50th → 0<br>75th → 0.67 · 90th → 1.28<br>95th → 1.645 · 97.5th → 1.96</div>Table and technology differ a little because the table has only two decimals. Both are accepted (within ±0.01). Next: you try."]],
y:{p:"Find the z-value of the 75th percentile.",st:[["Step 1. What is the target area to the left? (decimal)",0.75,["Percentile means percent below.","75th percentile → 75%.","75 ÷ 100 = 0.75."]],["Step 2. The table has 0.7486 at z = 0.67 and 0.7517 at z = 0.68. Which z is nearest to 0.7500?",0.67,["Find the gap between each value and 0.7500.","0.7500 − 0.7486 = 0.0014 and 0.7517 − 0.7500 = 0.0017.","The smaller gap wins: z = 0.67."],0.004],["Step 3. Technology check: NORM.S.INV(0.75) ≈ ? (4 decimals)",0.6745,["Type =NORM.S.INV(0.75) in Excel or use InvNorm.","The answer is positive because the area is above 0.50.","It is about 0.6745."],0.001]],f:"75th percentile: z ≈ <b>0.67</b> (table) or 0.6745 (technology). They differ by less than 0.01 ✓.§-9,0.67§"},
sp:{w:"“The 90th percentile is z = −1.28.”",o:["The area to the left is more than 0.50, so z must be positive. −1.28 is the 10th percentile.","He should use z = −1.29.","Percentiles are always negative.","He should have used NORM.S.DIST."],a:0,x:"The 90th percentile has 90% of the area to its left, so z = +1.28."},
q:[["z for area 0.8413",1,0.01,"Table: 0.8413 is at z = 1.00."],["z for area 0.0228",-2,0.01,"Area below 0.50 → negative. 0.0228 is at z = −2.00."],["z of the 99th percentile",2.33,0.01,"Area 0.99 → table 0.9901 at z = 2.33 (technology 2.326)."],["z of the 75th percentile",0.67,0.01,"Area 0.75 → z ≈ 0.67 (technology 0.674)."],["z of the 10th percentile",-1.28,0.01,"Area 0.10 is below 0.50, so z is negative: −1.28."]]},
{t:"Normal Problems: From X to z to Probability",s:"Jeepney times and rice sacks",o:"I can convert X to z and find P(X &lt; a), P(X &gt; a) and P(a &lt; X &lt; b), with units and a sentence.",
c:[["Hook: Biyahe Gikan sa Toril","Ang jeepney gikan Toril padulong downtown molungtad og mga <b>45 minutos</b>, ug mausab-usab og mga <b>8 minutos</b>. Kung mo-alis ka 60 ka minutos sa wala pa ang klase, luwas ba ka? <b>Guess the chance of being late</b> (in %). We will compute it today."],
["Why convert first","Real data are in minutes, kilograms, or grams. But the Z-table understands <b>only z-values</b>. So we first change x into z. One table then works for every normal situation.<div class='eq'>z = (x − μ) / σ</div>z tells how many standard deviations x is from the mean μ."],
["The 5-step method","<div class='ws'><b>1</b> Sketch the curve and shade the region.<br><b>2</b> Convert each x to z. Divide by σ, not σ².<br><b>3</b> Read the left area(s) from the table.<br><b>4</b> Subtract or take 1 − area, as the sketch shows.<br><b>5</b> Write a sentence with units.</div>The sketch tells you <i>what to do</i> in step 4."],
["Examples 1 and 2: the jeepney","Travel time T is normal, μ = 45 min, σ = 8 min.<br><b>Example 1:</b> P(T &gt; 60)<div class='ws'>z = (60 − 45) / 8 = 1.875 ≈ 1.88<br>P(Z &lt; 1.88) = 0.9699<br>1 − 0.9699 = <b>0.0301</b></div>§1.88,9§About 3 out of 100 trips take longer than an hour.<br><br><b>Example 2:</b> P(35 &lt; T &lt; 55)<div class='ws'>z = (35 − 45)/8 = −1.25 and (55 − 45)/8 = 1.25<br>0.8944 − 0.1056 = <b>0.7888</b></div>§-1.25,1.25§About 78.9% of trips take between 35 and 55 minutes."],
["Example 3 and common errors","<b>Example 3: rice sacks.</b> W is normal, μ = 25.2 kg, σ = 0.4 kg. Find P(W &lt; 24.5).<div class='ws'>z = (24.5 − 25.2)/0.4 = −1.75<br>P(Z &lt; −1.75) = <b>0.0401</b></div>§-9,-1.75§Out of 500 sacks, about 500 × 0.0401 ≈ <b>20 sacks</b> weigh less than 24.5 kg.<div class='err'><b>✗</b> z = (60 − 45)/64 = 0.23. Never divide by the variance σ² = 64.</div><div class='err'><b>✗</b> Looking up x = 60 in the Z-table. The table accepts only z.</div>"],
["Remember","Sketch → convert with σ → table → subtract → <b>sentence with units</b>. A number alone is not a complete answer. Next: you try."]],
y:{p:"Jeepney travel time T is normal with μ = 45 min and σ = 8 min. Find P(T &gt; 50).",st:[["Step 1. Compute x − μ.",5,["Subtract the mean from x.","50 − 45","= 5."]],["Step 2. z = (x − μ)/σ, rounded to 2 decimals.",0.63,["Divide 5 by σ, not σ².","5 ÷ 8 = ?","0.625, which rounds to 0.63."],0.006],["Step 3. Table: P(Z &lt; 0.63) = ?",0.7357,["Row 0.6, column .03.","Read where they meet.","0.7357."]],["Step 4. P(T &gt; 50) = 1 − P(Z &lt; 0.63) = ?",0.2643,["“Greater than” means the right tail.","1 − 0.7357","= 0.2643."]]],f:"P(T &gt; 50) = <b>0.2643</b>. About 26 out of 100 trips take longer than 50 minutes.§0.63,9§"},
sp:{w:"z = (60 − 45) / 64 = 0.23",o:["He used 6 instead of 0.06.","He divided by the variance (64) instead of the standard deviation (8).","He should have multiplied.","He used the wrong mean."],a:1,x:"σ = 8, so z = (60 − 45)/8 = 1.88. σ² = 64 is the variance and is never used in z."},
q:[["T ~ N(45, 8) min. P(T &lt; 30)",0.0301,0,"z = (30 − 45)/8 = −1.88 → 0.0301."],["P(T &gt; 50)",0.2643,0,"z = 0.63; 1 − 0.7357 = 0.2643."],["P(40 &lt; T &lt; 50)",0.4714,0.0015,"z = ±0.63; 0.7357 − 0.2643 = 0.4714 (technology 0.4727)."],["W ~ N(25.2, 0.4) kg. P(W &lt; 25.2)",0.5,0,"25.2 is the mean, so z = 0 and the left area is 0.5000."],["Same W. P(W &gt; 25.6)",0.1587,0,"z = (25.6 − 25.2)/0.4 = 1.00; 1 − 0.8413 = 0.1587."]]},
{t:"Cut-offs, Percentiles, and Decisions",s:"Local output: Decision Brief",o:"I can compute cut-off values using x = μ + zσ and justify a decision from the results.",
c:[["Hook: Tilapia sa Bankerohan","Sa Bankerohan, ang pinakabug-at nga <b>20%</b> sa tilapia ibaligya nga <b>Grade A</b>. Hain ang linya sa pagbulag, ug kinsay mo-decide niini: ang tindera ba o ang matematika? <b>Guess the cut-off weight</b> (grams) before we compute it."],
["Why we need it","Many decisions run the other way. We are given a <b>percent</b> (top 20%, bottom 10%) and must find the <b>boundary value</b>. We combine Day 2 (percent → z) with the reverse of Day 3.<div class='eq'>x = μ + zσ</div>Each cut-off is now backed by data, not guesswork."],
["The 5-step method","<div class='ws'><b>1</b> Sketch and shade the required tail.<br><b>2</b> Change the percent to the <b>area to the left</b>.<br><b>3</b> Find z: <b>top tail → +z, bottom tail → −z</b>.<br><b>4</b> Compute x = μ + zσ.<br><b>5</b> Check: convert x back to z.</div>Top 20% → left area 0.80. Bottom 10% → left area 0.10."],
["Examples 1 and 2: tilapia","Weight W is normal, μ = 250 g, σ = 30 g.<br><b>Example 1: Grade A = heaviest 20%.</b><div class='ws'>Area to the left = 0.80<br>Nearest table area 0.7995 → z = 0.84<br>x = 250 + 0.84(30) = <b>275.2 g</b></div>§0.84,9§Check: (275.2 − 250)/30 = 0.84 ✓. Fish of 275.2 g or more are Grade A.<br><br><b>Example 2: “small” = lightest 10%.</b><div class='ws'>Area to the left = 0.10 → z = −1.28<br>x = 250 + (−1.28)(30) = 250 − 38.4 = <b>211.6 g</b></div>§-9,-1.28§"],
["Example 3 and common error","<b>Example 3: test scores.</b> S is normal, μ = 78, σ = 8. Cut-off for the top 10%.<div class='ws'>Area to the left = 0.90 → z = 1.28<br>x = 78 + 1.28(8) = 78 + 10.24 = <b>88.24</b></div>§1.28,9§<div class='err'><b>✗ Wrong:</b> bottom 10% of tilapia: 250 + 1.28(30) = 288.4 g.</div><div class='good'><b>✓ 288.4 g is the boundary of the HEAVIEST 10%.</b> Bottom tail → negative z → 211.6 g. A bottom cut-off can never be larger than the mean.</div>"],
["Your Local Output: Decision Brief (50 pts)","Do this on paper or in Excel/GeoGebra. Choose <b>one</b> scenario:<div class='ws'><b>A. Jeepney scheduling,</b> T ~ N(45, 8) min<br>(i) P(T &gt; 55) (ii) 90th-percentile time (iii) P(40 &lt; T &lt; 50)<br><b>B. Fish grading,</b> W ~ N(250, 30) g<br>(i) P(W &gt; 300) (ii) cut-off for the heaviest 10% (iii) P(220 &lt; W &lt; 280)</div><b>Required:</b> 3 computations, shaded sketches, a summary table, interpretation sentences, and a <b>justified recommendation</b>. Next: you try."]],
y:{p:"Class scores S are normal, μ = 78, σ = 8. Find the cut-off for the top 15% (scholarship).",st:[["Step 1. What is the area to the LEFT of the cut-off?",0.85,["Top 15% means 15% is on the right.","100% − 15% = 85%.","Left area = 0.85."]],["Step 2. Find z for area 0.85 (nearest table value).",1.04,["Table: 0.8485 at z = 1.03 and 0.8508 at z = 1.04.","0.8508 is nearer to 0.8500.","z = 1.04 (positive: it is the top tail)."],0.006],["Step 3. Compute zσ = 1.04 × 8.",8.32,["Multiply z by σ.","1.04 × 8","= 8.32."]],["Step 4. x = μ + zσ = 78 + 8.32.",86.32,["Add to the mean.","78 + 8.32","= 86.32."],0.02]],f:"The cut-off is <b>86.3</b>. Students scoring 86.3 or higher belong to the top 15%.§1.04,9§"},
